<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0A3323" />
            <stop offset="100%" stop-color="#071B13" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="b" />
            <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            <![CDATA[
            text {
                font-family: Consolas, 'Fira Code', monospace
            }

            .t {
                fill: #8FFF73;
                font-size: 24px
            }

            .s {
                fill: #F7F4D5;
                font-size: 18px
            }

            .small {
                fill: #8FFF73;
                font-size: 20px
            }

            .cursor {
                animation: blink 1s steps(1) infinite
            }

            @keyframes blink {
                50% {
                    opacity: 0
                }
            }
            ]]>
        </style>
    </defs>

    <rect width="1200" height="910" rx="18" fill="url(#bg)" />

